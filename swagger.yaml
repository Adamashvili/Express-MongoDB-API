openapi: 3.0.0
info:
  title: Phone Store API
  version: 1.0.0
  description: Phone products REST API
servers:
  - url: https://myphonesstore.onrender.com/
    description: Production server
    
  - url: http://localhost:3000
    description: Local server
paths:
  /api/v1/phones:
    get:
      summary: Get all phones
      tags: [Phones]
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by title
        - in: query
          name: brand
          schema:
            type: string
          description: Filter by brand
        - in: query
          name: minPrice
          schema:
            type: number
          description: Minimum price
        - in: query
          name: maxPrice
          schema:
            type: number
          description: Maximum price
        - in: query
          name: page
          schema:
            type: number
          description: Page number
        - in: query
          name: limit
          schema:
            type: number
          description: Items per page
      responses:
        "200":
          description: Success
        "400":
          description: Failed
    post:
      summary: Create new phone (for Admin User)
      tags: [Phones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  type: string
                model:
                  type: string
                title:
                  type: string
                description:
                  type: string
                price:
                  type: object
                  properties:
                    current:
                      type: number
                    oldPrice:
                      type: number
                stock:
                  type: number
                color:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                colors:
                  type: array
                  items:
                    type: string
                ram:
                  type: string
                processor:
                  type: string
                chipset:
                  type: string
                screenType:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/phones/infoofprices:
    get:
      summary: Get info of prices
      tags: [Phones]
      responses:
        "200":
          description: Success
        "400":
          description: Failed

  /api/v1/phones/{id}:
    get:
      summary: Get single phone
      tags: [Phones]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "404":
          description: Not found
    patch:
      summary: Update phone (for Admin User)
      tags: [Phones]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand:
                  type: string
                model:
                  type: string
                title:
                  type: string
                price:
                  type: object
                  properties:
                    current:
                      type: number
                    oldPrice:
                      type: number
                stock:
                  type: number
                color:
                  type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
    delete:
      summary: Delete phone (for Admin User)
      tags: [Phones]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /api/v1/brands:
    get:
      summary: Get all brands
      tags: [Brands]
      responses:
        "200":
          description: Success


  /api/v1/users/getAllUsers:
    get:
      summary: Get All Users (for Admin User)
      tags: [Users]
      responses:
        "200":
          description: Success          

  /api/v1/users/signup:
    post:
      summary: Create new User Account
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                age:
                  type: number
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
                image:
                  type: string
                gender:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/users/login:
    post:
      summary: Sign In to your Account
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/users/forgotPassword:
    post:
      summary: Send Password Update code to your Email
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/users/resetPassword/{passToken}:
    patch:
      summary: Update Your Password
      tags: [Users]
      parameters:
        - in: path
          name: passToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Success
        "404":
          description: Not found

  /api/v1/users/updatePassword:
    patch:
      summary: Update Your password
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/users/updateUserAccount:
    patch:
      summary: Update Your Account
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                age:
                  type: number
                image:
                  type: string
                gender:
                  type: string  
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/users/deleteUserAccount:
    delete:
      summary: Delete Your password
      tags: [Users]
      responses:
        "201":
          description: Created
        "400":
          description: Failed

  /api/v1/cart:
    get:
      summary: Get Your Cart
      tags: [Cart]
      responses:
        "201":
          description: Created
        "400":
          description: Failed
    post:
      summary: Add Product To Cart
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: string      
      responses:
        "201":
          description: Created
        "400":
          description: Failed                      
    patch:
      summary: Update Product In Cart
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: string      
      responses:
        "201":
          description: Created
        "400":
          description: Failed 

  /api/v1/cart/{id}:
    delete:
      summary: Remove Product from Cart
      tags: [Cart]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "404":
          description: Not found                               